<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Gold Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Crescent Moon and Stars in Background -->
  <path d="M280 80 A70 70 0 0 0 350 150 A55 55 0 0 1 270 95 A70 70 0 0 0 280 80 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Sparkle stars -->
  <polygon points="370,85 374,95 385,99 374,103 370,113 366,103 355,99 366,95" fill="#fef08a" />
  <polygon points="140,115 143,122 150,125 143,128 140,135 137,128 130,125 137,122" fill="#fef08a" />
  <polygon points="380,180 382,186 388,188 382,190 380,196 378,190 372,188 378,186" fill="#fde68a" />

  <!-- Quran Stand (Rihal) Base -->
  <path d="M150 390 L256 310 L362 390 L382 376 L256 280 L130 376 Z" fill="#78350f" />
  <path d="M170 380 L256 320 L342 380 L352 370 L256 295 L160 370 Z" fill="#92400e" />

  <!-- Open Quran Book Pages -->
  <!-- Left Page -->
  <path d="M256 285 C220 280 160 250 110 230 C104 228 100 220 102 214 L120 144 C122 138 128 134 134 136 C180 155 230 180 256 195 Z" fill="url(#bookGrad)" stroke="#d97706" stroke-width="2" />
  <!-- Right Page -->
  <path d="M256 285 C292 280 352 250 402 230 C408 228 412 220 410 214 L392 144 C390 138 384 134 378 136 C332 155 282 180 256 195 Z" fill="url(#bookGrad)" stroke="#d97706" stroke-width="2" />

  <!-- Inner Arabic script decorative lines -->
  <path d="M140 165 C175 180 215 198 238 210" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M135 185 C170 200 210 218 238 230" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M130 205 C165 220 205 238 238 250" stroke="#059669" stroke-width="3" stroke-linecap="round" />

  <path d="M372 165 C337 180 297 198 274 210" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M377 185 C342 200 302 218 274 230" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M382 205 C347 220 307 238 274 250" stroke="#059669" stroke-width="3" stroke-linecap="round" />

  <!-- Golden Ray Light burst from center -->
  <circle cx="256" cy="210" r="14" fill="#fbbf24" filter="url(#glow)" />
  
  <!-- Banner Text: NOORUL QURAN -->
  <rect x="96" y="420" width="320" height="52" rx="26" fill="#047857" stroke="url(#goldGrad)" stroke-width="3" />
  <text x="256" y="454" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">NOORUL QURAN</text>
</svg>
